[build-system]
requires = [
    "setuptools>=82.0.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "simone_puyo"
version = "0.1.3"
authors = [
    { name = "Rémi Capillon" },
]
description = "Puyo Puyo deep learning AI"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy >= 2.4.2",
    "scipy >= 1.17.0",
    "matplotlib >= 3.10.8",
    "tensorflow >= 2.20.0",
    "tqdm >= 4.67.3",
    "streamlit >= 1.54.0"
]

[project.urls]
"Homepage" = "https://github.com/rcapillon/simone_puyo"
