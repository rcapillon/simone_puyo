[build-system]
requires = [
    "setuptools>=82.0.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "simone_puyo"
version = "0.1.4"
authors = [
    { name = "Rémi Capillon" },
]
description = "Puyo Puyo deep learning AI"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy == 2.4.0",
    "matplotlib >= 3.11.0",
    "tensorflow >= 2.21.0",
    "tqdm >= 4.68.3",
    "numba >= 0.65.1"
]

[project.urls]
"Homepage" = "https://github.com/rcapillon/simone_puyo"
